name: Deploy to GitHub Pages

on:
  # Runs every time something is pushed to main (which includes merged pull requests).
  push:
    branches: [main]
  # Lets you also run it by hand from the Actions tab.
  workflow_dispatch:

# Minimum permissions the Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push replaces one still waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
